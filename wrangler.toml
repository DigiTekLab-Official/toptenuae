name = "toptenuae"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ⚠️ CRITICAL: Keep this pointing to Vercel output to support Middleware
pages_build_output_dir = ".vercel/output/static"

# ------------------------------------------------------------------------------
# PUBLIC VARIABLES (Safe to commit)
# ------------------------------------------------------------------------------
[vars]
# Build Configuration
NODE_VERSION = "20"
NEXT_PUBLIC_BASE_URL = "https://toptenuae.com"

# Sanity CMS (Public configuration)
NEXT_PUBLIC_SANITY_PROJECT_ID = "kxdjzy8e"
NEXT_PUBLIC_SANITY_DATASET = "production"
NEXT_PUBLIC_SANITY_API_VERSION = "2024-01-01"
# These duplicates are fine to ensure both client/server side access
SANITY_PROJECT_ID = "kxdjzy8e"
SANITY_DATASET = "production"
SANITY_API_VERSION = "2024-01-01"

# Analytics (Public IDs)
NEXT_PUBLIC_GA_MEASUREMENT_ID = "G-PQMW1T9DF6"
NEXT_PUBLIC_GTM_ID = "GTM-N3PB47W"

# Cloudflare Turnstile (Public site key)
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAACKjWQd3pTknkISJ"

# Amazon Affiliate (Public configuration)
AMAZON_PARTNER_TAG = "apfunbox06-21"
AMAZON_REGION = "webservices.amazon.ae"

# Resend (Public audience ID)
RESEND_AUDIENCE_ID = "de69c6ac-8557-485f-8ce5-6db4654b50df"

# ------------------------------------------------------------------------------
# SECRET VARIABLES (Moved to Dashboard)
# ------------------------------------------------------------------------------
# ⚠️ DO NOT PUT SECRETS HERE. 
# ⚠️ NEVER put secrets here! Add them via Cloudflare Dashboard:
# Dashboard > Workers & Pages > toptenuae > Settings > Environment Variables
#
# Add these as ENCRYPTED variables:
# - SANITY_API_TOKEN
# - AMAZON_ACCESS_KEY
# - AMAZON_SECRET_KEY
# - RESEND_API_KEY
# - METALPRICE_API_KEY
# - EXCHANGE_RATE_API_KEY
# - TURNSTILE_SECRET_KEY
# - JWT_SECRET